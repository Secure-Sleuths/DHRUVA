# =============================================================================
# Risk Criteria - SecureSleuths DHRUVA Guidance
# This document defines how agents assess risk and priority.
# Modify per client engagement to reflect their specific environment.
# =============================================================================

asset_criticality:
  tier_1_critical:
    description: "Production databases, authentication servers, payment systems, secrets managers"
    patterns:
      - "*-prod-db*"
      - "*-auth-*"
      - "*-payment-*"
      - "*vault*"
      - "*-secrets-*"
    risk_multiplier: 3.0
    
  tier_2_important:
    description: "Production application servers, CI/CD, monitoring infrastructure"
    patterns:
      - "*-prod-app*"
      - "*-cicd-*"
      - "*jenkins*"
      - "*-monitor-*"
      - "*grafana*"
    risk_multiplier: 2.0
    
  tier_3_standard:
    description: "Staging environments, internal tools, development infrastructure"
    patterns:
      - "*-staging-*"
      - "*-dev-*"
      - "*-internal-*"
    risk_multiplier: 1.0
    
  tier_4_low:
    description: "Test environments, sandbox, non-production lab systems"
    patterns:
      - "*-test-*"
      - "*-sandbox-*"
      - "*-lab-*"
    risk_multiplier: 0.5

user_risk_profiles:
  high_risk:
    description: "Service accounts, admin users, root, external contractors"
    indicators:
      - "has_admin_privileges"
      - "is_service_account"
      - "is_external_contractor"
      - "recently_onboarded_days: 30"
    risk_multiplier: 2.5
    
  elevated:
    description: "Engineers with production access, DevOps, SRE"
    indicators:
      - "has_production_access"
      - "is_devops_role"
    risk_multiplier: 1.5
    
  standard:
    description: "Regular employees with standard access"
    risk_multiplier: 1.0

alert_severity_mapping:
  # Maps Wazuh rule levels (1-15) to risk categories
  critical: [13, 14, 15]
  high: [10, 11, 12]
  medium: [7, 8, 9]
  low: [4, 5, 6]
  informational: [1, 2, 3]

time_context:
  business_hours:
    start: "09:00"
    end: "18:00"
    timezone: "Asia/Kolkata"
    days: ["monday", "tuesday", "wednesday", "thursday", "friday"]
  
  maintenance_windows:
    - name: "Weekly patching"
      day: "sunday"
      start: "02:00"
      end: "06:00"
    - name: "Deployment window"
      days: ["tuesday", "thursday"]
      start: "22:00"
      end: "23:59"
      
  risk_adjustments:
    outside_business_hours_multiplier: 1.5
    maintenance_window_multiplier: 0.3
    weekend_multiplier: 1.3

mitre_attack_priority:
  # Higher priority MITRE techniques
  critical_techniques:
    - "T1003"  # OS Credential Dumping
    - "T1059"  # Command and Scripting Interpreter
    - "T1053"  # Scheduled Task/Job
    - "T1021"  # Remote Services
    - "T1110"  # Brute Force
    - "T1190"  # Exploit Public-Facing Application
    - "T1486"  # Data Encrypted for Impact (Ransomware)
    - "T1070"  # Indicator Removal
    - "T1098"  # Account Manipulation
    - "T1078"  # Valid Accounts

composite_risk_formula: |
  risk_score = (
    alert_base_severity 
    * asset_criticality_multiplier 
    * user_risk_multiplier 
    * time_context_multiplier
    * mitre_priority_boost
  )
  
  # Clamp to 0-100 scale
  final_score = min(100, max(0, risk_score))
  
  # Classification:
  # 90-100: CRITICAL - Immediate human review required
  # 70-89:  HIGH     - Agent triage with human verification
  # 40-69:  MEDIUM   - Agent triage, auto-close if high confidence
  # 0-39:   LOW      - Agent auto-triage, batch review


# =============================================================================
# scoring — how a rule's track record becomes a number (WO-H71, WO-H115)
# -----------------------------------------------------------------------------
# THE COLD-START PROBLEM, WHICH EVERY NEW DEPLOYMENT HAS
#
# The risk score asks one question: how often has a PERSON agreed this rule
# fired correctly? On day one nobody has agreed anything, so every rule is
# unlearned, every alert takes `unknown_rule_tp_rate`, and the whole queue sits
# in `high`. That is deliberate — see the long comment in
# src/enrichment/service.py::_compute_risk_score_bounded. "Unknown" resolves
# UPWARD, because a real intrusion scoring its way out of the queue on a fresh
# install costs far more than an extra review.
#
# The way out is for analysts to label alerts, and the rule goes quiet on its
# own. The trap is the shortcut: letting the platform label its own backlog to
# make the noise stop. Do that and the machine's opinion becomes
# indistinguishable from a person's — it can make a rule QUIET with exactly the
# authority of an analyst who looked at it.
#
# So machine review is supported, and bounded:
#   * name the machine identities in `machine_reviewers`;
#   * their labels count at `machine_label_weight` each;
#   * and no matter how many there are, they are worth at most
#     `machine_label_cap` observations in total — because 5,000 machine labels
#     are one model's opinion repeated, not 5,000 independent judgements;
#   * and they NEVER make a score `confident`. Confidence stays human-only, so
#     the case view keeps saying "no track record for this rule yet" until a
#     person has actually looked.
#
# `machine_reviewers` is EMPTY by default. A deployment that has never used
# machine review scores exactly as it did before this block existed.
# =============================================================================
scoring:
  # Estate-wide prior for how often a rule fires correctly. Used to smooth a
  # rule with few labels toward the middle rather than letting 1/1 read as 100%.
  base_tp_rate: 0.5

  # What an UNLEARNED rule scores. 0.75 -> a score of exactly 75.00, which the
  # severity ladder places in `high` (escalated, 60-minute SLA, shown as "no
  # track record yet") and NOT in `critical`.
  #
  # ⚠ If you change this, re-read src/incidents/severity.py first. A band
  # boundary must never sit on the score the model emits when it knows nothing
  # — that collision made every unlearned alert a critical incident once
  # already.
  unknown_rule_tp_rate: 0.75

  # How many labels FROM PEOPLE a rule needs before its own record is trusted.
  min_human_labels: 3

  # Identities that are not people: the platform's own reviewer account, any
  # bulk-import or backfill account, any integration that writes verdicts.
  # Per client. Example:
  #   machine_reviewers: ["dhruva-ai-analyst", "servicenow-sync"]
  machine_reviewers: []

  # Each machine label is worth this much of a human one...
  machine_label_weight: 0.25
  # ...and all of them together are worth at most this many observations.
  machine_label_cap: 10
