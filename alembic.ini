# DHRUVA Alembic configuration
#
# The DSN comes from the DATABASE_URL env var at runtime — env.py
# reads it directly so we never check credentials into version control.
# For day-to-day commands run from the repo root:
#
#   export DATABASE_URL="postgresql+psycopg://user:pass@host:5432/dhruva"
#   alembic upgrade head
#   alembic current
#   alembic history

[alembic]
script_location = src/database/migrations

# Use SQLAlchemy 2.x URL conventions (postgresql+psycopg) — psycopg v3 driver.
# Leave this blank; env.py picks it up from DATABASE_URL instead.
sqlalchemy.url =

# We do not auto-generate migrations from model metadata (no SQLAlchemy ORM
# models — DHRUVA uses raw SQL via psycopg). All migrations are authored
# by hand under versions/.
file_template = %%(rev)s_%%(slug)s

# Timestamps in revision filenames (off — we use 4-digit sequence numbers
# starting at 0001 for the baseline).
timezone = UTC

# Python logging configuration — minimal, redirected through the app's
# structlog when invoked at boot.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
