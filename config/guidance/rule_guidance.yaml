# Per-rule triage guidance — DHRUVA Community Edition
#
# NO RULES ARE CONFIGURED HERE, AND THE PLATFORM SAYS SO OUT LOUD.
#
# On startup and on every POST /api/guidance/reload, a `rules:` block with no
# entries is logged as `rule_guidance_empty` at WARNING level, and
# GET /api/guidance/version reports `rule_guidance_rules: 0`. That is
# deliberate. The file is not pretending to do something it is not doing, and
# you do not have to read this comment to find out.
#
# WHY IT IS EMPTY RATHER THAN PRE-FILLED
#
# Per-rule guidance is the most estate-specific knowledge in the platform. An
# entry here says "on THIS network, rule N normally fires because X, and the
# one case that matters looks like Y" — and the only way to write that
# truthfully is to look at your own alerts. A rota of shipped entries written
# against somebody else's estate would be worse than nothing: every stale
# exclusion is a false positive that pushes the model toward escalation, and
# every wrong `expected` is a real detection talked down.
#
# So this ships as a documented, empty, working file. Nothing silently changes
# behaviour, everything below is live schema, and your first entry takes effect
# without a restart.
#
# WHAT IT IS FOR
#
# The risk score answers "how often has a human agreed this rule fired
# correctly?". It cannot separate two alerts from the SAME rule at the SAME
# frequency — they score identically by construction, and no further learning
# changes that. When the thing that separates them is a FIELD in the alert
# rather than a volume, that knowledge belongs here: a deterministic, checked-in
# check that runs before the model and is shown to the analyst.
#
# Typical shapes worth writing down:
#   * a service/driver install whose startType or image path is the tell
#   * an admin tool that is routine from one host and never from another
#   * an account whose failed logins are a batch job, not an attacker
#
# HOW TO ADD ONE
#
#   1. Find a rule that fires a lot and is nearly always benign.
#   2. Pull ten of its alerts and find the field that distinguishes the rare
#      real case. It must be a field, not a count.
#   3. Write the signal below, reload, and check
#      GET /api/guidance/version shows your rule.
#   4. Re-read it quarterly. See the rot warning at the bottom.
#
# SCHEMA
#   rules:
#     <wazuh rule id>:
#       name:     short human name for the rule
#       summary:  what normally causes this rule to fire on your estate
#       signals:  ordered list of deterministic checks (see below)
#       analyst_note: free text appended to the triage prompt
#
#   A signal is:
#     id:      stable identifier, appears in logs and in the decision record
#     signal:  escalate | expected | note
#     because: WHY — this text is shown to the analyst and to the model
#     when:    { all: [condition, ...] }  or  { any: [condition, ...] }
#
#   A condition is a `field` (dotted path into the normalised alert) plus ONE
#   operator: equals, equals_ignore_case, not_equals, contains, matches (regex),
#   in, not_in, exists.
#
#   `not_in` is CASE-INSENSITIVE and FAILS CLOSED on a missing field: if the
#   field is absent the condition is False, so the signal does not fire. That
#   matches `not_equals`, and it is the safe direction for an exclusion, but it
#   is the opposite of what "not in this list" reads like — so a signal whose
#   only guard is `not_in` will go silent on alerts missing that field.
#
#   `escalate` always beats `expected` when both match. Safety wins ties.
#
# WORKED EXAMPLE — copy it, do not uncomment it as-is. The rule id, the fields
# and the exclusions all have to be yours.
#
# rules:
#   "61138":                       # Windows Event 7045, New Service Installed
#     name: "New Windows Service Created"
#     summary: >
#       Service installation. Mostly benign and recurring on any Windows fleet
#       — updaters, monitoring agents, vendor drivers reinstalling themselves.
#       High baseline false-positive rate, which is exactly why the rare case
#       has to be separated on fields rather than on volume.
#     signals:
#       - id: kernel_driver_system_start
#         signal: escalate
#         because: >
#           A kernel-mode driver set to SYSTEM START loads at boot, before most
#           security software. That is the shape of stealth persistence and of
#           bring-your-own-vulnerable-driver tooling (MITRE T1543.003). This is
#           a WEAK signal on its own — plenty of legitimate drivers load this
#           way — so it needs an exclusion list built from YOUR OWN fleet.
#         when:
#           all:
#             - field: data.win.eventdata.serviceType
#               contains: "kernel mode driver"
#             - field: data.win.eventdata.startType
#               equals_ignore_case: "system start"
#             - field: data.win.eventdata.serviceName
#               not_in:
#                 # Seed this from a real system32\drivers listing on one of
#                 # your own hosts. Without it, this signal fires on the
#                 # operating system.
#                 - intelppm
#                 - mssmbios
#                 - nsiproxy
#     analyst_note: >
#       Decide this alert on startType and on the image path, not on how often
#       the rule fires. If a signal escalates, get the file hash BEFORE anything
#       reboots or cleans the host.
#
# ⚠ EXCLUSION LISTS ROT, AND THAT IS NOT A BUG YOU CAN FIX.
#   An exclusion list is a denylist of known-good names inside a signal about
#   unknown-bad names, which is self-refuting by construction. It goes stale in
#   three directions: new OS builds, new GPU/storage/EDR vendors, and whatever
#   third-party software you happen to run. Every stale entry is a FALSE
#   POSITIVE that pushes the model toward escalation.
#   OWNER: your SOC lead. REVIEW: quarterly, and after any fleet driver rollout.
#
#   The structurally better signal is a corroborating one — an AV detection on
#   the same host in the same minute, or first-seen-on-estate rarity — not a
#   pattern match on a name. Prefer it where you can.

version: 1

rules: {}
