# =============================================================================
# Escalation Logic - DHRUVA Community Edition
# Defines when agents escalate vs auto-resolve.
# =============================================================================
#
# THIS IS A STARTING POINT, NOT A TUNED POLICY. READ BEFORE YOU RELY ON IT.
#
# Everything below is generic: it keys on normalised fields DHRUVA computes for
# every alert (asset_tier, mitre_tactic, rule_level, time_context) and, where it
# names a Wazuh rule id at all, only on ids from the STOCK Wazuh ruleset. No
# entry here was derived from any particular estate's alert volumes, and none of
# it is calibrated to yours.
#
# It WORKS as shipped — the file loads, the auto-close and always-escalate
# conditions are live, and the severity floor and ceiling at the bottom are
# active from first boot. That is deliberate: an empty policy that silently does
# nothing is worse than a documented default you can see and change. But
# "working" is not "tuned":
#
#   * VERIFY EVERY RULE ID against your own manager before trusting it.
#     `/var/ossec/ruleset/rules/` is the list. An id that does not exist on your
#     install makes that entry match nothing, silently.
#   * READ THE CEILING FIRST. A ceiling LOWERS severity, and
#     src/notifications/service.py::notify_incident_created only notifies on
#     `critical` and `high` — so capping something to `medium` is SILENCE, not a
#     quieter channel. The one ceiling shipped here is the safest, most common
#     case there is; it is still a decision you should make on purpose.
#   * ADD YOUR OWN. The custom-rule range that Wazuh reserves for operator-
#     written rules is where your estate's real tuning will end up. Nothing
#     from that range is, or can be, shipped in this file — a guard on the
#     publish path fails the release if one appears.
#
# Edit this file and POST /api/guidance/reload — no restart, no release.
# =============================================================================

auto_close_conditions:
  # ALL conditions in a group must be true for auto-close
  - name: "Known scanner noise"
    conditions:
      - field: "src_ip"
        match: "known_scanner_list"
      - field: "rule_level"
        operator: "<="
        value: 6
      - field: "mitre_tactic"
        not_in: ["credential-access", "lateral-movement", "exfiltration"]
    confidence_floor: 0.85
    
  - name: "Maintenance window activity"
    conditions:
      - field: "time_context"
        match: "maintenance_window"
      - field: "agent_name"
        match: "known_ci_cd_agents"
      - field: "rule_group"
        in: ["syscheck", "vulnerability-detector"]
    confidence_floor: 0.90
    
  - name: "Repeated benign pattern"
    conditions:
      - field: "historical_fp_rate"
        operator: ">="
        value: 0.85
      - field: "rule_level"
        operator: "<="
        value: 8
      - field: "same_rule_closed_benign_last_7d"
        operator: ">="
        value: 5
    confidence_floor: 0.88

  - name: "Development environment noise"
    conditions:
      - field: "asset_tier"
        in: ["tier_4_low"]
      - field: "rule_level"
        operator: "<="
        value: 9
      - field: "mitre_tactic"
        not_in: ["exfiltration", "impact"]
    confidence_floor: 0.85

always_escalate:
  # ANY of these conditions triggers immediate human escalation
  - name: "Critical asset credential access"
    conditions:
      - field: "asset_tier"
        in: ["tier_1_critical"]
      - field: "mitre_tactic"
        in: ["credential-access"]
        
  - name: "Data exfiltration indicators"
    conditions:
      - field: "mitre_tactic"
        in: ["exfiltration"]
      - field: "data_volume_anomaly"
        value: true
        
  - name: "Ransomware indicators"
    conditions:
      - field: "mitre_technique"
        in: ["T1486", "T1490"]  # Data Encrypted for Impact, Inhibit System Recovery
        
  - name: "Multiple failed auth then success"
    conditions:
      - field: "rule_group"
        in: ["authentication_failures"]
      - field: "followed_by_success"
        value: true
      - field: "unique_source_count"
        operator: ">="
        value: 3
        
  - name: "New admin account creation"
    conditions:
      - field: "rule_group"
        in: ["account_management"]
      - field: "action"
        in: ["create_admin", "privilege_escalation"]
      # WO-H76: a maintenance window IS outside business hours — the two are
      # facts about the same timestamp, not alternatives. Once the resolver
      # started preserving "maintenance_window" (so the auto-close rule above
      # could finally match), a bare match on "outside_business_hours" would
      # have stopped escalating admin-account creation during maintenance
      # windows — which is precisely when an attacker would use one as cover.
      - field: "time_context"
        in: ["outside_business_hours", "maintenance_window"]

  - name: "High severity on any tier-1 asset"
    conditions:
      - field: "asset_tier"
        in: ["tier_1_critical"]
      - field: "rule_level"
        operator: ">="
        value: 10

# ⚠ THIS BLOCK IS NOT THE NOTIFICATION GATE. Nothing in src/ reads
# `notification_channels` — it is descriptive/prompt config only. The real gate
# is code: src/notifications/service.py::notify_incident_created returns early
# unless the incident severity is `critical` or `high`, and the channels are
# whatever is configured in .env (Slack/Telegram/email).
#
# So the `medium: hourly_digest` line below does NOT mean a medium incident is
# emailed in a digest. A medium incident is NOT ANNOUNCED AT ALL. This matters
# when reading the severity_policy ceilings at the bottom of this file: capping
# an incident to medium is silence, not a quieter channel.
notification_channels:
  critical:
    - type: "telegram"
      bot: "soc_alerts_bot"
      chat_id: "${TELEGRAM_CRITICAL_CHAT}"
    - type: "email"
      recipients: ["soc-critical@securesleuths.local"]
      
  high:
    - type: "telegram"
      bot: "soc_alerts_bot"
      chat_id: "${TELEGRAM_HIGH_CHAT}"
      
  medium:
    - type: "email"
      recipients: ["soc-team@securesleuths.local"]
      frequency: "hourly_digest"
      
  low:
    - type: "dashboard_only"

sla_targets:
  critical:
    initial_response_minutes: 15
    resolution_hours: 4
  high:
    initial_response_minutes: 60
    resolution_hours: 24
  medium:
    initial_response_minutes: 240
    resolution_hours: 72
  low:
    initial_response_minutes: 1440
    resolution_hours: 168


# =============================================================================
# Deterministic severity floors and ceilings
# -----------------------------------------------------------------------------
# DHRUVA's risk score answers "how often has a human agreed this rule fired
# correctly?". Severity is read as "how dangerous is this?". Those are different
# questions, and no amount of further learning closes the gap on its own:
#
#   * A crawler asking for a file that is not there, getting a 404 every time,
#     scores very high — because the rule genuinely fires correctly every time.
#   * A host that has stopped reporting scores very low — because analysts
#     correctly say a disconnected agent is not an attack. That label is TRUE,
#     so the score can never learn its way up.
#
# Floors and ceilings are the SOC's judgement about consequence, expressed as
# rules rather than as scores. They live here, next to sla_targets and
# always_escalate, so they are hot-reloadable via POST /api/guidance/reload and
# tunable without a release. Only the lookup is in code
# (src/incidents/severity.py).
#
# ── READ THIS BEFORE EDITING ─────────────────────────────────────────────────
#
# A CEILING IS NOT "LOWER PRIORITY". IT IS SILENCE.
# src/notifications/service.py::notify_incident_created returns early unless the
# severity is `critical` or `high`. Capping an incident to `medium` means NO
# creation notification is sent — not a quieter one, none. Adding a ceiling is a
# decision to stop telling anyone about that alert.
#
# MATCHING: an entry fires when the alert's rule id is in `rule_ids` OR one of
# its rule groups is in `rule_groups`, AND every condition below that is present
# also holds:
#     http_status        exact code(s) the server returned, e.g. ["404", "400"]
#     http_status_class  the class, e.g. ["4xx"]
#     max_rule_level     bounds the `rule_groups` selector ONLY — see below
#     exclude_paths      exact absolute file paths this entry is scoped away
#                        from (structured `syscheck.path`; no wildcards)
#
# `max_rule_level` BOUNDS THE GROUP SELECTOR AND NOTHING ELSE. A rule named in
# `rule_ids` always matches, whatever its level. The cap exists to limit how far
# an UNENUMERATED group can reach; a named id is a number someone typed and a
# reviewer can read in the diff. An entry that sets a cap with NO `rule_groups`
# is refused at load, and a cap that a named rule walks past is logged once.
#
# PREFER `rule_ids` ON A CEILING. A group selector is a loaded gun: Wazuh's
# `web` group contains the level-10 "…from same source IP" frequency rules and
# the SQLi / XSS / Shellshock / blacklisted-user-agent rules alongside the plain
# 4xx ones, and those must never be silenced. A ceiling that uses `rule_groups`
# is therefore REFUSED unless it also sets `max_rule_level`, and the refusal is
# reported by POST /api/guidance/reload.
#
# PRECEDENCE: a ceiling is skipped when threat intel confirms the indicator
# (is_known_malicious, or threat_intel_hits > 0), then ceilings lower the band,
# then floors raise it — so a floor always wins over a ceiling. Do NOT treat the
# threat-intel skip as a safety net; it is a correctness rule, and the selector
# itself still has to be right.
#
# A typo'd `severity:` does not silently disable an entry — the entry is
# rejected and POST /api/guidance/reload reports the reload as FAILED.
# =============================================================================
severity_policy:

  floors:
    # Loss of visibility. An analyst will never label a disconnected agent
    # "dangerous", because it is not an attack — so this needs a RULE, not a
    # score. A host that stops reporting is a host nobody can see, and the
    # things that happen on an unmonitored host are exactly the things you
    # bought a SIEM to notice.
    #
    # `medium` (a 4-hour response target), not `high`: a laptop closing its lid
    # must not page anyone at 1am, but a host that is still dark hours later
    # must show up as an SLA breach instead of sitting invisibly at the bottom
    # of the queue. Raise it if your estate is all servers.
    #
    # 504 is stock Wazuh's "Ossec agent disconnected", in the `ossec` group.
    # 503 ("agent started") is deliberately absent — an agent coming BACK is not
    # a loss of visibility. If your install has its own custom agent-down rule
    # in the operator range, add its id here; stock ids are all this file can
    # honestly assume you have.
    #
    # The floor is per ALERT and it lifts by itself: it applies to the
    # disconnect alert, and nothing re-applies it once the agent reports again.
    - name: "Loss of visibility — something that should be reporting has stopped"
      rule_ids: [504]
      rule_groups:
        - "service_availability"
        - "agent_disconnected"
      severity: "medium"
      reason: >-
        This host or service has stopped reporting, so DHRUVA can no longer see
        what is happening on it. It is not an attack, which is why analysts
        label it a false positive and why its learned score stays near zero —
        but a blind endpoint still needs someone to look.

  ceilings:
    # Reconnaissance the server refused. Both rules fire on the REQUEST,
    # whatever the server answered; the response code is in the alert already
    # (Wazuh's web-accesslog decoder puts it in data.id).
    #
    #     31101  "Web server 400 error code."   level 5
    #     31516  "Suspicious URL access."       level 6
    #
    # Both are stock Wazuh rules. They are named EXPLICITLY rather than selected
    # by the `web` group, because that group also holds the level-10 "from same
    # source ip" frequency rules and the SQLi / XSS / Shellshock /
    # blacklisted-user-agent rules, none of which should ever be silenced.
    #
    # ONLY 404 AND 400 ARE CAPPED — deliberately not 401 or 403. A 404 is "you
    # asked for something that is not there" and a 400 is "your request was
    # malformed": the attempt failed and nothing was reached. A 401 is a FAILED
    # CREDENTIAL — a burst of those from one source is credential stuffing — and
    # a 403 is an authenticated session being refused, which is a different and
    # more interesting event. Neither is a crawler finding nothing, so neither
    # is capped.
    #
    # This deliberately does NOT cap a 2xx. If the crawler ever gets a 200 for
    # /.env.bak, the alert keeps its full score-derived severity.
    #
    # If internet-facing web logs are not in your Wazuh install, this entry
    # simply never matches and costs nothing.
    - name: "Web request the server refused (404/400)"
      rule_ids: [31101, 31516]
      http_status: ["404", "400"]
      severity: "medium"
      reason: >-
        The server refused this request — it asked for something that is not
        there, or the request was malformed. Nothing was found and nothing was
        served. A high risk score means the rule fires accurately, not that
        anything was reached.
